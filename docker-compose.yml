services:
  db:
    image: postgres:16-alpine
    container_name: caged_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-caged_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgress} -d ${POSTGRES_DB:-caged_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: caged_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgress}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-caged_db}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
